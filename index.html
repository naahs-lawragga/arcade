<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Arcade — play in your browser</title>
  <link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/game-shell.css">
</head>
<body>
  <main class="site-shell">
    <section id="home-view" aria-labelledby="arcade-title">
      <header class="hero"><p class="eyebrow">LOCAL • INSTANT • NO EMBEDS</p><h1 id="arcade-title">ARCADE</h1><p>Small, bright games that start right here.</p></header>
      <div id="game-grid" class="game-grid" aria-live="polite"></div>
    </section>
    <section id="play-view" hidden aria-live="polite">
      <header class="game-bar"><button id="back-button" class="back-button">← Back to Arcade</button><div><p class="eyebrow">NOW PLAYING</p><h2 id="game-title"></h2></div><button id="restart-button" class="restart-button">Restart</button></header>
      <div id="game-stage" class="game-stage"></div>
    </section>
  </main>
  <script defer src="js/shared/input.js"></script>
  <script defer src="js/shared/storage.js"></script>
  <script defer src="js/gameLoader.js"></script>
  <script defer src="js/main.js"></script>
</body>
</html>
