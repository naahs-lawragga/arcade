<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Arcade — Admin Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕹️</text></svg>">
  <style>
    body {
      background: #0d0d12;
      color: #f3f4f6;
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 40px 20px;
    }
    .admin-container {
      max-width: 600px;
      margin: 0 auto;
      background: #161622;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.8rem;
      margin-top: 0;
      color: #a855f7;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-group {
      margin-bottom: 25px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }
    input[type="text"], textarea {
      width: 100%;
      padding: 12px;
      background: #0d0d12;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      box-sizing: border-box;
      margin-bottom: 10px;
    }
    input[type="text"]:focus, textarea:focus {
      border-color: #a855f7;
      outline: none;
    }
    .btn {
      padding: 10px 18px;
      background: #6366f1;
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-danger { background: #ef4444; }
    .back-link {
      display: inline-block;
      margin-top: 20px;
      color: #888;
      text-decoration: none;
      font-weight: 500;
    }
    .back-link:hover { color: #fff; }
    .user-list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0d0d12;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 8px;
      border: 1px solid rgba(255,255,255,0.05);
    }
  </style>
</head>
<body>

  <div class="admin-container">
    <h1>⚙️ Admin Control Panel</h1>
    <p style="color: #888; margin-bottom: 30px;">Manage cloud announcements and synchronized global user accounts.</p>

    <!-- Announcement Manager -->
    <div class="section-group">
      <label for="announcement-input">Site Announcement Banner</label>
      <textarea id="announcement-input" rows="3" placeholder="Type an announcement to display globally..."></textarea>
      <button class="btn" onclick="saveAnnouncement()">Publish Announcement</button>
      <button class="btn btn-danger" onclick="clearAnnouncement()" style="background: #374151; margin-left: 5px;">Remove Banner</button>
    </div>

    <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 30px 0;">

    <!-- User Management -->
    <div class="section-group">
      <label>Registered Cloud Users & Bans</label>
      <div id="users-container" style="max-height: 200px; overflow-y: auto; margin-top: 10px;">
        <p style="color: #666; font-size: 0.9rem;">Loading users...</p>
      </div>
    </div>

    <a href="index.html" class="back-link">← Return to Arcade</a>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDf5Z8jyxVDgPuLxo4ImYBcUwaM6DlDYXM",
      authDomain: "web-arcade-9d87c.firebaseapp.com",
      projectId: "web-arcade-9d87c",
      storageBucket: "web-arcade-9d87c.firebasestorage.app",
      messagingSenderId: "295769001488",
      appId: "1:295769001488:web:b0971a736f5c0054618495"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.addEventListener('DOMContentLoaded', async () => {
      const currentUser = sessionStorage.getItem('arcade_current_user');
      
      if (currentUser !== 'naahs') {
        try {
          const userDoc = await getDoc(doc(db, "arcade_users", currentUser));
          if (!userDoc.exists() || !userDoc.data().isAdmin) {
            alert('Access denied. Administrator privileges required.');
            window.location.href = 'index.html';
            return;
          }
        } catch (e) {
          alert('Access denied.');
          window.location.href = 'index.html';
          return;
        }
      }

      try {
        const annDoc = await getDoc(doc(db, "arcade_config", "announcement"));
        if (annDoc.exists()) {
          document.getElementById('announcement-input').value = annDoc.data().text || '';
        }
      } catch (err) {
        console.error(err);
      }

      loadUsers();
    });

    window.saveAnnouncement = async function() {
      const text = document.getElementById('announcement-input').value.trim();
      try {
        await setDoc(doc(db, "arcade_config", "announcement"), { text: text });
        alert('Announcement published globally!');
      } catch (err) {
        console.error(err);
        alert('Failed to publish announcement.');
      }
    }

    window.clearAnnouncement = async function() {
      try {
        await setDoc(doc(db, "arcade_config", "announcement"), { text: "" });
        document.getElementById('announcement-input').value = '';
        alert('Announcement removed.');
      } catch (err) {
        console.error(err);
      }
    }

    async function loadUsers() {
      const container = document.getElementById('users-container');
      container.innerHTML = '';

      try {
        const querySnapshot = await getDocs(collection(db, "arcade_users"));
        if (querySnapshot.empty) {
          container.innerHTML = '<p style="color: #666; font-size: 0.9rem;">No registered users found.</p>';
          return;
        }

        querySnapshot.forEach((userDoc) => {
          const username = userDoc.id;
          const data = userDoc.data();
          const isBanned = data.isBanned || false;

          const item = document.createElement('div');
          item.className = 'user-list-item';
          item.innerHTML = `
            <span>👤 ${username} ${isBanned ? '<span style="color: #ef4444; font-size: 0.8rem;">(Banned)</span>' : ''}</span>
            <button class="btn ${isBanned ? '' : 'btn-danger'}" style="padding: 6px 12px; font-size: 0.85rem;" onclick="toggleBan('${username}', ${isBanned})">
              ${isBanned ? 'Unban' : 'Ban'}
            </button>
          `;
          container.appendChild(item);
        });
      } catch (err) {
        console.error(err);
        container.innerHTML = '<p style="color: #f87171; font-size: 0.9rem;">Error loading users.</p>';
      }
    }

    window.toggleBan = async function(username, currentStatus) {
      try {
        const userRef = doc(db, "arcade_users", username);
        await updateDoc(userRef, { isBanned: !currentStatus });
        loadUsers();
      } catch (err) {
        console.error(err);
        alert('Failed to update ban status.');
      }
    }
  </script>
</body>
</html>
