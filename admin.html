<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Arcade — Admin Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      background: #0d0d12;
      color: #f3f4f6;
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 40px 20px;
    }
    .admin-container {
      max-width: 600px;
      margin: 0 auto;
      background: #161622;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.8rem;
      margin-top: 0;
      color: #a855f7;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-group {
      margin-bottom: 25px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }
    input[type="text"], textarea {
      width: 100%;
      padding: 12px;
      background: #0d0d12;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      box-sizing: border-box;
      margin-bottom: 10px;
    }
    input[type="text"]:focus, textarea:focus {
      border-color: #a855f7;
      outline: none;
    }
    .btn {
      padding: 10px 18px;
      background: #6366f1;
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-danger { background: #ef4444; }
    .back-link {
      display: inline-block;
      margin-top: 20px;
      color: #888;
      text-decoration: none;
      font-weight: 500;
    }
    .back-link:hover { color: #fff; }
    .user-list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0d0d12;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 8px;
      border: 1px solid rgba(255,255,255,0.05);
    }
  </style>
</head>
<body>

  <div class="admin-container">
    <h1>⚙️ Admin Control Panel</h1>
    <p style="color: #888; margin-bottom: 30px;">Manage site announcements, registered users, and administrative access.</p>

    <!-- Announcement Manager -->
    <div class="section-group">
      <label for="announcement-input">Site Announcement Banner</label>
      <textarea id="announcement-input" rows="3" placeholder="Type an announcement to display across the top of the arcade..."></textarea>
      <button class="btn" onclick="saveAnnouncement()">Publish Announcement</button>
      <button class="btn btn-danger" onclick="clearAnnouncement()" style="background: #374151; margin-left: 5px;">Remove Banner</button>
    </div>

    <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 30px 0;">

    <!-- User Management -->
    <div class="section-group">
      <label>Registered Users & Bans</label>
      <div id="users-container" style="max-height: 200px; overflow-y: auto; margin-top: 10px;">
        <!-- Populated dynamically via script -->
      </div>
    </div>

    <a href="index.html" class="back-link">← Return to Arcade</a>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      // Security check: only allow 'naahs' or designated admins
      const currentUser = sessionStorage.getItem('arcade_current_user');
      const admins = JSON.parse(localStorage.getItem('arcade_admins') || '[]');
      
      if (currentUser !== 'naahs' && !admins.includes(currentUser)) {
        alert('Access denied. Administrator privileges required.');
        window.location.href = 'index.html';
        return;
      }

      // Load existing announcement
      const currentAnnouncement = localStorage.getItem('arcade_announcement');
      if (currentAnnouncement) {
        document.getElementById('announcement-input').value = currentAnnouncement;
      }

      loadUsers();
    });

    function saveAnnouncement() {
      const text = document.getElementById('announcement-input').value.trim();
      if (text) {
        localStorage.setItem('arcade_announcement', text);
        alert('Announcement published successfully!');
      } else {
        clearAnnouncement();
      }
    }

    function clearAnnouncement() {
      localStorage.removeItem('arcade_announcement');
      document.getElementById('announcement-input').value = '';
      alert('Announcement removed.');
    }

    function loadUsers() {
      const container = document.getElementById('users-container');
      container.innerHTML = '';

      const passwords = JSON.parse(localStorage.getItem('arcade_passwords') || '{}');
      const bannedUsers = JSON.parse(localStorage.getItem('arcade_banned_users') || '[]');
      const usernames = Object.keys(passwords);

      if (usernames.length === 0) {
        container.innerHTML = '<p style="color: #666; font-size: 0.9rem;">No registered users found.</p>';
        return;
      }

      usernames.forEach(user => {
        const isBanned = bannedUsers.includes(user);
        const item = document.createElement('div');
        item.className = 'user-list-item';
        item.innerHTML = `
          <span>👤 ${user} ${isBanned ? '<span style="color: #ef4444; font-size: 0.8rem;">(Banned)</span>' : ''}</span>
          <button class="btn ${isBanned ? '' : 'btn-danger'}" style="padding: 6px 12px; font-size: 0.85rem;" onclick="toggleBan('${user}')">
            ${isBanned ? 'Unban' : 'Ban'}
          </button>
        `;
        container.appendChild(item);
      });
    }

    function toggleBan(username) {
      let bannedUsers = JSON.parse(localStorage.getItem('arcade_banned_users') || '[]');
      if (bannedUsers.includes(username)) {
        bannedUsers = bannedUsers.filter(u => u !== username);
      } else {
        bannedUsers.push(username);
      }
      localStorage.setItem('arcade_banned_users', JSON.stringify(bannedUsers));
      loadUsers();
    }
  </script>
</body>
</html>
